<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Название проекта</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a8220'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E%E2%99%BB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Сцена 16:9: все размеры внутри неё заданы для 1600x900 и масштабируются под экран -->
  <div id="stage">

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section id="menu" class="screen active">
      <header class="menu-header">
        <h1 class="menu-title">Название проекта</h1>
        <button class="ui-btn icon-only fs-btn" type="button" aria-label="На весь экран">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <div class="cards" id="cards"></div>
    </section>

    <!-- УРОК -->
    <section id="lesson" class="screen">
      <div class="bg" id="bgA"></div>
      <div class="bg" id="bgB"></div>
      <div id="chars"></div>

      <button id="btnMenu" class="ui-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Меню</span>
      </button>
      <button class="ui-btn icon-only fs-btn lesson-fs" type="button" aria-label="На весь экран">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div id="dialog">
        <div id="nameTag"></div>
        <button id="btnReplay" class="replay" type="button" aria-label="Повторить озвучку" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <p id="text"></p>
        <svg id="nextArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg>
      </div>
    </section>

    <div id="fade"></div>
  </div>

  <!-- Подсказка для телефона в вертикальном положении -->
  <div id="rotate" role="alert">
    <div class="phone"></div>
    <p>Поверните телефон горизонтально</p>
  </div>

  <noscript>Для работы сайта нужен включённый JavaScript.</noscript>

  <script src="js/data/common.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/lesson1.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
